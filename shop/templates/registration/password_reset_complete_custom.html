{% extends 'shop/base.html' %}

{% block content %}
    <style>
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-container p {
            text-align: center;
            color: #555;
        }

        .auth-container a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0c5a2cd0;
            text-decoration: none;
        }

        .auth-container a:hover {
            text-decoration: underline;
        }
    </style>
    <div class="auth-container">
        <h2>Mot de passe réinitialisé</h2>
        <p>Votre mot de passe a bien été modifié. Vous pouvez maintenant vous connecter.</p>
        <a href="{% url 'login' %}" class="btn btn-success mt-2">Se connecter</a>
    </div>
{% endblock %}
