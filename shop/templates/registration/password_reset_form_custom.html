<!-- template : formulaire demande réinitialisation -->
{% extends 'shop/base.html' %}
    
{% block content %}
    <style>
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            background: #0c5a2cd0;
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-container button:hover {
            background: #0c5a2cd0;
        }
    </style>
    <div class="auth-container">
        <h2>Mot de passe oublié</h2>
        <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit" class="btn btn-primary mt-2">Envoyer</button>
        </form>
    </div>
{% endblock %}
